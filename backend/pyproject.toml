[project]
name = "alpha-pilot-backend"
version = "0.1.0"
description = "AlphaPilot AI Trading System Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "apscheduler>=3.10.4",
    "httpx>=0.28.0",
    "python-binance>=1.0.19",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b",
    "openai>=1.58.0",
    "python-dotenv>=1.0.0",
    "uuid6>=2024.7.10",
    "cryptography>=44.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.2.0",
    "asgi-correlation-id>=4.3.4",
    "starlette-context>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "fakeredis>=2.23.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# 治理已知第三方 DeprecationWarning（项目自身代码不得触发；如未来本项目代码触发将照常显示）
filterwarnings = [
    "ignore:websockets.WebSocketClientProtocol is deprecated:DeprecationWarning",
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
    "ignore:The 'mode.copy_on_write' option is deprecated:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# E501(line-too-long) 不作为 lint 错误: 行宽由 `ruff format` (line-length=100) 负责;
# 且 project.md §4 强制 model 字段单行 mapped_column, 与硬性 100 列上限本质冲突,
# 故按 Ruff 官方建议在启用 formatter 时关闭 E501 lint, 保留 F/I 与其余 E 规则抓真实问题.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试沿用紧凑断言风格: `assert a; assert b` (E702) 与 `if cond: stmt` (E701),
# 是本仓库既有约定, 不作为错误.
"tests/*" = ["E701", "E702"]
