name: Deploy Dev

# push 到 dev 分支 → 直接 SSH 部署到服务器 dev 环境。
# 注：CI 不再跑测试门禁——单测/构建在本地提交前完成（make test + 前端 build）。
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      deploy_script: scripts/deploy-dev.sh
    secrets: inherit
