name: Deploy Test

# push 到 test 分支 → 直接 SSH 部署到服务器 test 环境。
# 注：CI 不再跑测试门禁——单测/构建在本地提交前完成。
on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: test
      deploy_script: scripts/deploy-test.sh
    secrets: inherit
