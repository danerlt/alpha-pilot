# prod 应用栈（/ap，api 8003 / 前端 3003）
# 不含 pg/redis：连共享中间件（ap-postgres / ap-redis）
# database=alphapilot_prod，Redis db=2。端口仅绑 127.0.0.1，由 nginx 经 https 反代。
#
# build-once / deploy-many：引用预构建镜像，tag 由 scripts/deploy-prod.sh 注入。
#   backend/scheduler 复用 alphapilot-backend:${IMAGE_TAG}（与 dev/test 同一 SHA 镜像）
#   frontend 按环境构建 alphapilot-frontend:${FRONTEND_TAG}（= <sha>-prod）

name: ap-prod

services:
  backend:
    image: alphapilot-backend:${IMAGE_TAG:?IMAGE_TAG required}
    env_file:
      - ../envs/prod.env
    environment:
      DATABASE_URL: postgresql://alphapilot:${DB_PASSWORD:-alphapilot}@ap-postgres:5432/alphapilot_prod
      REDIS_URL: redis://ap-redis:6379/2
      ROOT_PATH: /ap
    ports:
      - "127.0.0.1:8003:8000"
    restart: unless-stopped
    networks:
      - ap-shared

  scheduler:
    image: alphapilot-backend:${IMAGE_TAG:?IMAGE_TAG required}
    env_file:
      - ../envs/prod.env
    environment:
      DATABASE_URL: postgresql://alphapilot:${DB_PASSWORD:-alphapilot}@ap-postgres:5432/alphapilot_prod
      REDIS_URL: redis://ap-redis:6379/2
    command: ["python", "scripts/start_scheduler.py"]
    depends_on:
      - backend
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - ap-shared

  frontend:
    image: alphapilot-frontend:${FRONTEND_TAG:?FRONTEND_TAG required}
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ap-shared

networks:
  ap-shared:
    external: true
