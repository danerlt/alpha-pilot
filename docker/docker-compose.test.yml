# test 应用栈（/ap-test，api 8002 / 前端 3002）
# 不含 pg/redis：连共享中间件（ap-postgres / ap-redis）
# database=alphapilot_test，Redis db=1。
# 端口仅绑 127.0.0.1，由 nginx 反代。

name: ap-test

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    env_file:
      - ../envs/test.env
    environment:
      DATABASE_URL: postgresql://alphapilot:${DB_PASSWORD:-alphapilot}@ap-postgres:5432/alphapilot_test
      REDIS_URL: redis://ap-redis:6379/1
      ROOT_PATH: /ap-test
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped
    networks:
      - ap-shared

  scheduler:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    env_file:
      - ../envs/test.env
    environment:
      DATABASE_URL: postgresql://alphapilot:${DB_PASSWORD:-alphapilot}@ap-postgres:5432/alphapilot_test
      REDIS_URL: redis://ap-redis:6379/1
    command: ["python", "scripts/start_scheduler.py"]
    depends_on:
      - backend
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - ap-shared

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        BASE_PATH: /ap-test
        NEXT_PUBLIC_API_BASE: /ap-test/api
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ap-shared

networks:
  ap-shared:
    external: true
